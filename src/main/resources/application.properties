# Application Name
spring.application.name=backend

# Load local .env (KEY=VALUE) so IntelliJ/mvn runs work without exporting vars.
# 'optional:' means it's skipped in CI/prod where real env vars are used.
spring.config.import=optional:file:.env[.properties]

# Server port parameterization with default 8080
server.port=${PORT:8080}

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false


# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Configuration
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# OTP Configuration
otp.ttl-seconds=${OTP_TTL_SECONDS}
otp.max-attempts=${OTP_MAX_ATTEMPTS}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS}