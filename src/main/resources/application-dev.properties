# Development Profile Settings
server.port=${PORT:8080}

# Logging configuration for local development
logging.level.com.project.backend=DEBUG
logging.level.org.springframework.web=INFO

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/launchpad}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Admin API Key (set via env var ADMIN_API_KEY in production)
admin.api.key=${ADMIN_API_KEY:dev-admin-key-change-in-production}

# Question configuration
question.limits.min-time-ms=100
question.limits.max-time-ms=10000
question.limits.min-memory-kb=16384
question.limits.max-memory-kb=524288
question.publish.min-sample-cases=1
question.publish.min-hidden-cases=3
question.page.max-size=100