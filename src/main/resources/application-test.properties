# Test server
server.port=0

# Dedicated test database
spring.datasource.url=${TEST_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/launchpad_test}}
spring.datasource.username=${TEST_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Logging
logging.level.com.project.backend=WARN
logging.level.org.springframework.web=WARN